[project]
name = "kv-cache-agentic-rag"
version = "0.1.0"
description = "KIVI × ITME: team node development foundation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langsmith>=0.4,<1",
  "pydantic>=2.10,<3",
  "jinja2>=3.1.6,<4",
  "pyyaml>=6,<7",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
rag = [
  "sentence-transformers>=5.1,<6",
  "transformers>=4.51,<5",
  "faiss-cpu>=1.12,<2",
  "numpy>=1.26,<3",
  "flagembedding>=1.3,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
