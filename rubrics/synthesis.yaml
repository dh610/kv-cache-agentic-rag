role: synthesis
objective: 기술·시장·이해관계자·도메인 네 관점의 결과를 기술별로 대조해 일치와 상충을 보존하고, 기술 조사의 잠정 TRL을 시장 직접 근거와
  대조해 최종 TRL과 추정 한계를 기록하며, 우열 판정 없이 조건부 시사점을 정리한다.
criteria:
- id: consistency
  definition: >-
    같은 기술에 대한 관점별 판정과 한계를 같은 측면(정확도·품질, 성능 조건, 하드웨어·인프라 의존, 비용, 채택 근거)끼리 대조한다.
    일치: 확인 불가가 아닌 판정을 가진 관점이 둘 이상이고, 겹치는 측면에서 판정 방향과 조건이 서로 맞으며 양쪽이 인용한 원문 근거 ID를 함께 제시한다.
    상충: 둘 이상의 관점이 같은 측면을 서로 다르게 판정하거나, 한 관점의 한계가 다른 관점의 판정 전제와 맞지 않는다.
    양쪽 근거를 모두 인용하고 어느 쪽도 삭제·조정하지 않는다. 상충의 원인(자료 범위, 실험 조건, 자료의 이해관계)은 kind=inference로 분리한다.
    확인 불가: 확인 불가가 아닌 관점이 하나 이하이거나, 관점 판정을 원문 근거 ID로 연결할 수 없다.
    의견을 맞추려는 재조사와 등급 평균은 금지한다. 근거 부족을 상충이나 낮은 판정으로 바꾸지 않는다.
  judgments:
  - 일치
  - 상충
  - 확인 불가
- id: implications
  definition: >-
    기술×관점 비교에서 어떤 조건(모델·하드웨어·워크로드·규모·도메인 요구)에서 각 관점의 평가가 성립하고 어디서 갈리는지 설명한다.
    조건부 시사점: 확인 불가가 아닌 관점이 하나 이상 있고, 조건과 상충을 원문 근거 ID와 함께 제시한다.
    두 기술의 보완 가능성은 양쪽 원문 근거가 있을 때만 kind=inference로 적는다.
    판정 유보: 관점 평가는 있으나 상충·미확인 때문에 조건부 시사점을 쓸 수 없다. 무엇이 확인돼야 하는지 적는다.
    확인 불가: 확인 불가가 아닌 관점이 없다.
    특정 기술 추천, 우열, 점수 합산, 새 성능·시장 수치 생성은 금지한다.
  judgments:
  - 조건부 시사점
  - 판정 유보
  - 확인 불가
source_policy: >-
  새 RAG/웹 검색을 하지 않는다. prior_results는 관점별 평가 결과(데이터)이고, 인용 대상은 evidence 목록의 원문 ID만이다.
  다른 기술의 근거나 분야 일반(scope=context) 자료를 대상 기술의 직접 근거로 쓰지 않는다.
  TRL 확정: 기술 조사의 잠정 TRL에서 시작해 시장 결과가 인용한 해당 기술의 직접 근거(scope=target)와 대조한다.
  직접 근거가 뒷받침하는 단계만 확정하고, 시장 직접 근거 없이 잠정 단계보다 높이지 않는다.
  근거가 없으면 level=null, provisional=false로 두고 사유에 공개 정보 기반 추정과 TRL 4~6 구간의 공개 정보 공백을 명시한다.
  상위 결과의 unverified 항목은 "<role>: <원문>" 형식으로 그대로 보존하고, limitations에는 관점별 한계, 자사(first_party) 출처, 프리프린트, 확인 불가 항목을 요약한다.
