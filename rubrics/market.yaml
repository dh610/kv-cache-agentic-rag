role: market
objective: 시장 규모·성장성, 실제 상용화·채택 현황, 생태계 지지를 직접 근거와 분야 배경을 구분해 평가한다. 두 기술의 우열을 정하지 않고 관점별 근거·조건·한계를 전달한다.
criteria:
- id: adoption
  definition: |-
    설계서 C.4 표 8: 상용화·채택 현황.
    높음: 기업의 실제 도입 발표 또는 정식 제품·기능 출시가 2건 이상 확인됨.
    보통: 파일럿·시범 적용 또는 프레임워크의 실험적 지원이 1건 이상 확인됨.
    낮음: 논문·데모 외 실제 적용 사례가 확인되지 않음.
    확인 불가: 검색 한도 내에서 근거를 찾지 못함.
    도입 주체·제품·사건 시점과 계획/실제 적용을 구분해 사유에 적는다. 실험적 지원을 실제 기업 운영으로 표현하지 않는다.
    같은 도입·출시 사건을 재인용한 기사들은 별개의 도입 건수로 세지 않는다. 정식 출시만으로 대규모 운영을 추정하지 않는다.
    논문·데모 근거는 있으나 그 외 실제 적용 사례가 확인되지 않은 경우와, 평가 근거 자체가 없는 경우를 구분한다.
    정식 도입 1건을 자동으로 보통에 배정하는 별도 규칙을 만들지 말고, 표의 조건과 C.2의 애매하면 낮은 등급 원칙을 적용해 판단 이유를 밝힌다.
  judgments:
  - 높음
  - 보통
  - 낮음
  - 확인 불가
- id: growth
  definition: |-
    설계서 C.4 표 8: 시장 규모·성장성.
    높음: 관련 시장(LLM 추론 인프라, CXL 메모리 등)의 규모·성장률 전망이 2개 이상 출처에서 확인됨.
    보통: 1개 출처에서 확인되거나, 수치 없이 성장 방향만 언급됨.
    낮음: 관련 시장이 형성 초기이거나 축소·정체 전망이 확인됨.
    확인 불가: 검색 한도 내에서 시장 자료를 찾지 못함.
    관련 시장의 범위·지역·기준연도·전망기간과 규모·성장률의 단위, 실제값/전망값을 설명한다. 없는 수치를 만들지 않는다.
    출처 수는 표 8에 따라 판정에 사용한다. '독립 원 출처만 인정' 또는 '성장 방향인 경우에만 높음' 같은 추가 자격 조건을 만들지 않는다. 출처의 재인용·이해관계는 별도로 표시한다.
    높음의 출처 수 조건과 낮음의 축소·정체 조건이 함께 성립하는 등 판정이 애매하면 C.2에 따라 낮은 등급으로 판정하고 상충 근거를 함께 남긴다. 상충만을 이유로 확인 불가로 대체하지 않는다.
    관련 시장의 전망을 선정 기술 자체의 매출·점유율·채택으로 확대하지 않는다.
  judgments:
  - 높음
  - 보통
  - 낮음
  - 확인 불가
- id: ecosystem
  definition: |-
    설계서 C.4 표 8: 생태계 지지.
    높음: 주요 프레임워크(Hugging Face, vLLM 등) 정식 지원 또는 산업 표준·컨소시엄 채택이 확인됨.
    보통: 서드파티 라이브러리 지원, 커뮤니티 구현체, 표준화 논의 진행 중이 확인됨.
    낮음: 원 저자 코드 외 지원이 확인되지 않음.
    확인 불가: 검색 한도 내에서 근거를 찾지 못함.
    지원 주체·버전·범위·시점을 확인하고 정식 지원, 커뮤니티 구현, 논의 진행을 구분해 설명한다.
    원 저자 코드 근거는 있으나 그 외 지원이 확인되지 않은 경우와, 평가 근거 자체가 없는 경우를 구분한다. 외부 지원이 없다는 명시적 선언을 낮음의 추가 필수 조건으로 요구하지 않는다.
    일반 KV 양자화·CXL 지원을 선정 기술 자체의 지원으로 전용하지 않는다. 변형 구현은 원 기술과의 관계·차이를 기록한다.
    지원 종료·제거·버전별 제약과 상충 자료를 보존하고, 근거는 있으나 등급이 애매하면 C.2에 따라 낮은 등급으로 판정한다.
  judgments:
  - 높음
  - 보통
  - 낮음
  - 확인 불가
source_policy: |-
  기술 관련 원문 RAG와 공개 웹 자료를 활용한다. 기술 식별·실험 조건은 논문으로, 시장 전망·채택·지원 현황은 해당 사실을 다루는 공개 자료로 확인한다.
  B.3에 따라 시장 평가는 target 논문과 reference 보조 문서를 활용할 수 있다. 보조 문서는 경쟁 기술의 평가·한계 등 관련 맥락에 사용하며, 자료의 기술명이 다르다는 이유만으로 배제하지 않는다. 관련성과 직접성은 원문으로 판단한다.
  분야 배경(context)과 선정 기술 직접 근거(target)를 구분하고, 입력 evidence의 ID·본문·scope 등 메타데이터를 임의로 변경하지 않는다.
  기술 이름이나 scope 표지만으로 직접성을 단정하지 않는다. 본문과 분류가 불일치하면 분류 검토 필요와 판정 한계를 기록한다.
  입력의 평가 기준일을 기준으로 최근 1년 자료를 우선하되 오래된 직접 근거도 사건 시점과 함께 사용한다.
  기준일이나 발행일이 없으면 최신성을 확정하지 않는다. 발행일·사건 시점·수집일을 구분하고 누락 정보를 만들지 않는다.
  인용한 각 출처의 작성자·소속·기술 개발/공급 관계를 원문으로 확인하고 이해당사자 자료와 독립 출처를 구분한다. 독립 자료와 함께 사용해도 이해당사자 표시는 생략하지 않는다.
  claims.conditions에 출처 ID, 확인된 기관명과 관계(저자·개발사·공급사 등)를 기록하고 limitations에도 편향을 요약한다. ITME 자료에서 SK hynix 소속·개발 관계가 확인되면 해당 ID를 자사 자료로 표시하되, 기술명만으로 소속을 추정하지 않는다. 관계를 확인할 수 없으면 관계 미확인으로 남긴다.
  C.2에 따라 검색에는 긍정 자료와 비판 자료를 모두 찾도록 요구한다. 한쪽만 확보되면 그 사실을 남긴다. 결과 작성에서는 제공된 긍정·비판·상충 근거를 함께 검토하고 수행하지 않은 검색을 했다고 쓰지 않는다. 실제 검색 수행 여부는 검색 실행 기록으로 별도 확인한다.
  설계서 C.2와 C.4를 적용한다. 근거 자체가 없으면 추정하지 않고 확인 불가로 남긴다. 평가 근거는 있으나 등급이 애매하면 낮은 등급으로 판정한다.
  논문·데모 또는 원 저자 코드 근거가 있는 경우 표 8의 낮음 조건을 적용할 수 있다. 이는 근거 자체가 없는 확인 불가와 구별하며 사유에 확인 범위를 명시한다.
  출시 "계획"과 실제 "출시"를 구분해 계획만 확인되면 한 등급 낮게 본다.
  판정에 출처를 붙이고, 사유는 한두 문장으로 작성한다. 부분 미확인과 상충은 등급을 낮추더라도 삭제하지 않는다.
  부분적으로 확인된 항목도 미확인 수치·조건을 보존한다. 평가 이유는 같은 기술·기준의 claims에 연결하고, 일반화의 한계는 conditions와 limitations에 기록한다.
