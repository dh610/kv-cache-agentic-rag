role: market
objective: 시장 규모·성장성, 실제 상용화·채택 현황, 생태계 지지를 직접 근거와 분야 배경을 구분해 평가한다.
criteria:
- id: growth
  definition: '시장 범위·기준연도·전망기간을 명시한다. 높음: 규모/성장 전망 2개 이상 출처, 보통: 1개 또는 방향만, 낮음: 초기
    형성 또는 축소·정체. 출처 수와 성장 방향이 충돌하면 충돌을 명시하고 확인 불가로 보류해 사람 검토를 요청한다. 자료 없음은 확인 불가.'
  judgments: &id001
  - 높음
  - 보통
  - 낮음
  - 확인 불가
- id: adoption
  definition: '높음: 직접 확인된 기업 도입/정식 출시 2건 이상. 보통: 파일럿/시범/실험적 지원 1건 이상. 낮음: 조사 결과 논문·데모
    단계에 머문다는 근거가 확인됨. 검색 실패나 자료 부족은 확인 불가. 출시 계획은 실제 출시와 구분한다.'
  judgments: *id001
- id: ecosystem
  definition: '높음: 주요 프레임워크 정식 지원/표준 채택. 보통: 커뮤니티 구현/표준화 논의. 낮음: 원 저자 코드만 제공된다는 조사
    근거. 단순 검색 무결과는 확인 불가. 원 논문과 다른 유사 구현을 정식 지원으로 간주하지 않는다.'
  judgments: *id001
source_policy: 기술 관련 원문 RAG와 공개 웹 자료를 활용한다. 시장 일반 자료는 context로 표시하며 특정 기술 채택으로 확대
  해석하지 않는다.
