role: market
objective: 시장 규모·성장성, 실제 상용화·채택 현황, 생태계 지지를 직접 근거와 분야 배경을 구분해 평가한다.
criteria:
- id: adoption
  definition: 공개된 제품/서비스의 구체적 채택 증거를 확인한다. 논문 저자의 제안, GitHub 관심도는 채택 증거와 다르다.
  judgments:
  - 채택 확인
  - 시험 도입 확인
  - 확인 불가
- id: growth
  definition: 시장 범위·기준연도·전망기간과 규모/성장 방향을 확인한다. 출처 개수만으로 성장성을 판정하지 않는다. 분야 전망을 선정 기술의 매출이나 채택으로 해석하지 않는다.
  judgments:
  - 성장 근거 있음
  - 정체·축소 근거 있음
  - 전망 혼재
  - 확인 불가
- id: ecosystem
  definition: 선정 기술의 프레임워크·라이브러리·표준 지원 여부와 실제 지원 버전/범위를 확인한다. 영감을 받은 구현이나 같은 계열 기술의 지원을 해당 논문의 공식 통합으로 간주하지 않는다.
  judgments:
  - 정식 지원 확인
  - 실험적·커뮤니티 지원 확인
  - 확인 불가
source_policy: 기술 관련 원문 RAG와 공개 웹 자료를 활용한다. 시장 일반 자료는 context로 표시하며 특정 기술 채택으로 확대
  해석하지 않는다.
