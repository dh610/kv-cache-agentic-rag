role: tech
objective: KIVI와 ITME의 원리, 적용 조건, 실험 조건과 한계를 원문에서 구분하고 TRL을 잠정 추정한다.
criteria:
- id: mechanism
  definition: KV cache 최적화 원리, 필요한 SW/HW 구성과 적용 전제를 대상 논문에서 확인한다.
  judgments:
  - 원리 확인
  - 조건부 확인
  - 확인 불가
- id: maturity
  definition: 실험 모델·하드웨어·워크로드·기준선과 부품·시스템 검증 환경을 확인하고, 실습 가이드의 TRL 1~9단계를 공개 정보 기반으로 잠정 추정한다. 논문 발표나 코드 공개만으로 상위 단계를 부여하지 않는다.
  judgments:
  - TRL 1
  - TRL 2
  - TRL 3
  - TRL 4
  - TRL 5
  - TRL 6
  - TRL 7
  - TRL 8
  - TRL 9
  - 확인 불가
- id: limitations
  definition: 정확도·품질, 지연, 대역폭, 메모리, 하드웨어 의존성과 실험의 재현·일반화 제약을 원문에서 확인한다.
  judgments:
  - 제약 확인
  - 확인 불가
source_policy: 각 기술의 대상 논문 원문만 사용한다. 다른 기술의 실험 결과를 대상 기술의 성능이나 TRL 근거로 전용하지 않는다.
