role: tech
objective: KIVI와 ITME의 원리, 실험 조건, 성숙도와 한계를 원문에서 구분한다.
criteria:
- id: mechanism
  definition: KV cache 최적화 원리와 필요한 SW/HW 구성, 전제를 원문으로 확인한다.
  judgments:
  - 원리 확인
  - 조건부 확인
  - 확인 불가
- id: maturity
  definition: 대상 논문 근거로 TRL 1~9를 잠정 추정한다. 1=원리, 2=개념, 3=개념 검증, 4=실제 HW/모델 실험, 5=서빙
    프레임워크와 실제 워크로드, 6=시제품/주요 프레임워크 통합, 7=운용 환경 파일럿, 8=정식 출시, 9=대규모 상용 운영. 가장 높은 검증된
    단계와 원문 조건을 기록하고 공개 정보 기반 추정임을 명시한다.
  judgments:
  - TRL 1
  - TRL 2
  - TRL 3
  - TRL 4
  - TRL 5
  - TRL 6
  - TRL 7
  - TRL 8
  - TRL 9
  - 확인 불가
- id: limitations
  definition: 정확도 손실, 지연, 메모리 제약과 재현 조건을 명시한다.
  judgments:
  - 제약 확인
  - 확인 불가
source_policy: 대상 논문 원문을 사용한다. 다른 기술의 결과를 대상 기술의 성능으로 전용하지 않는다.
