role: stakeholder
objective: 개발자, 운영자, 공급자 등 각 주체가 실제로 발표한 견해를 비교한다.
criteria:
- id: competitors
  definition: '경쟁 기술 진영의 직접 반응. KIVI: TurboQuant/KVTC/MLA, ITME: NVIDIA CMX/삼성 CXL/PNM.
    긍정=보완·통합·채택 언급, 중립=단순 비교/별개 문제, 부정=한계 명시. 반응이 없으면 확인 불가. 일반 분야 발언은 대상 기술 반응으로
    전용하지 않는다.'
  judgments: &id001
  - 긍정
  - 중립
  - 부정
  - 확인 불가
- id: adopters
  definition: 도입 기업·개발자의 원문 반응. 긍정=실사용 효과 확인, 중립=조건부/엇갈린 효과, 부정=도입 장벽/품질 저하가 주된 반응.
    발언자·날짜·조건을 기록하고 근거가 없으면 확인 불가.
  judgments: *id001
- id: industry
  definition: 투자·업계 반응. 긍정=성장 전망/투자·제휴, 중립=판단 없는 동향 소개, 부정=시기상조/비용 대비 효과 의문. 자사 발표와
    독립 반응을 구분하고 원문 근거가 없으면 확인 불가.
  judgments: *id001
source_policy: 공개 웹이 주 경로다. 경쟁 기술 진영(competitors) 질문에 한해 reference 논문을 보조 조회하고, 상위 기술 결과와 원문 근거를 참고한다. 자사 반응과 독립 반응을 구분한다.
