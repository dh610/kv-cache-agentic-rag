role: domain
objective: 데이터센터·클라우드 LLM 서빙에서 적용 조건, 운영 부담, 병목 적합성을 평가한다.
criteria:
- id: fit
  definition: 동시성, context 길이, 정확도, TTFT/TPOT, 처리량, 메모리 제약과 기술 전제를 연결한다. 서로 다른 실험
    수치는 직접 순위화하지 않는다.
  judgments:
  - 적합
  - 조건부 적합
  - 부적합
  - 확인 불가
- id: operations
  definition: GPU/CPU/CXL 구성, 배포 변경, 장애 대응 등 운영 전제를 확인한다.
  judgments:
  - 운영 조건 확인
  - 확인 불가
- id: cost
  definition: 도입/운영 비용 항목을 확인한다. 공개 가격이나 측정 없이 TCO 절감율을 만들지 않는다.
  judgments:
  - 비용 근거 있음
  - 확인 불가
source_policy: 대상 원문 RAG와 도메인 웹 자료를 사용한다. 비교 논문은 reference/context로 표시한다.
