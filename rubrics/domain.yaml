role: domain
objective: 데이터센터·클라우드 LLM 서빙에서 적용 조건, 운영 부담, 병목 적합성을 평가한다.
criteria:
- id: cost
  definition: 비용(TCO). 적합=추가 장비 불필요 또는 장비 대비 GPU 절감 수치, 조건부=특정 규모·워크로드에서만 절감, 부적합=실제
    비용 요구조건 미충족 근거. 신규 인프라만 있고 절감 정보가 없으면 확인 불가로 남기고 설계서 해석 검토 대상으로 기록한다.
  judgments: &id001
  - 적합
  - 조건부 적합
  - 부적합
  - 확인 불가
- id: performance
  definition: 성능. 적합=논문과 외부 사례 모두 처리량/지연 개선, 조건부=논문/특정 문맥·배치에서만 개선, 부적합=목표 워크로드에서
    성능 저하 근거. 모델·장비·규모·기준선을 기록하며 서로 다른 실험 수치를 직접 우열로 해석하지 않는다.
  judgments: *id001
- id: quality
  definition: 품질. 적합=정확도 손실 없음/명시된 벤치마크에서 무시 가능한 수준, 조건부=일부 작업·설정에서 저하, 부적합=서비스 요구
    품질을 못 맞춘다는 근거. 요구 수준이나 근거가 없으면 확인 불가.
  judgments: *id001
- id: operations
  definition: 도입·운영 난이도. 적합=기존 프레임워크 설정 수준, 조건부=커스텀 구현/특정 장비·드라이버, 부적합=요구 환경과 명시적으로
    양립 불가. 신규 장비와 SW 변경만으로 부적합을 단정하지 않고 통합 부담과 설계서 해석 검토를 기록한다.
  judgments: *id001
- id: scalability
  definition: 확장성. 적합=사용자·문맥 증가에도 효과 유지, 조건부=특정 규모까지만 검증, 부적합=규모 증가 시 효과 감소 근거. 논문
    GPU 규모와 실제 데이터센터 규모 차이를 반드시 기록한다.
  judgments: *id001
source_policy: 대상 target 논문 RAG와 도메인 웹 자료를 사용한다. reference 논문은 새로 검색하지 않는다.
