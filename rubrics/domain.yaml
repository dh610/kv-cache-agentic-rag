role: domain
objective: >-
  데이터센터·클라우드 LLM 서빙(대규모·비용 민감, 장문맥·멀티턴 요청이 많은 조건)에서 KIVI와 ITME 각각의 적용 조건, 운영 부담, 병목 적합성을 원문 근거로 판정한다. 두 기술의 우열을 판정하지 않고 기술별로 어떤 조건에서 어떻게 평가되는지만 기록한다.
criteria:
- id: cost
  definition: >-
    비용(TCO). 적합=추가 장비 없이 기존 GPU 서버에 적용 가능하거나, 장비 투자 대비 GPU·메모리 절감 효과가 모델·장비·워크로드를 명시한 수치로 확인됨. 조건부 적합=절감 효과가 특정 규모·배치·문맥 길이·워크로드에서만 확인됨. 부적합=목표 도메인의 비용 요구조건을 충족하지 못한다는 명시적 사실 근거(예. 절감보다 큰 추가 비용이 원문에서 확인됨)가 있음. 확인 불가=비용·절감 근거가 없음. 신규 인프라가 필요하다는 사실만 있고 절감 정보가 없으면 부적합이 아니라 확인 불가로 두고, 설계서 표 10과의 해석 차이를 limitations에 기록한다.
  judgments: [적합, 조건부 적합, 부적합, 확인 불가]
- id: performance
  definition: >-
    성능(처리량·지연). 적합=논문 실험과 그와 독립적인 외부 적용 사례 모두에서 처리량 또는 지연(TTFT 등) 개선이 확인됨. 조건부 적합=논문 실험에서만 확인되거나 특정 문맥 길이·배치·모델 크기에서만 개선됨. 부적합=목표 워크로드에서 개선이 없거나 성능 저하 구간이 원문에 보고됨. 확인 불가=성능 근거 없음. 모든 수치에 모델·하드웨어·워크로드·비교 기준선을 붙이고, 서로 다른 실험의 수치를 직접 비교하거나 우열로 해석하지 않는다. 논문 근거만 있으면 최대 조건부 적합이다.
  judgments: [적합, 조건부 적합, 부적합, 확인 불가]
- id: quality
  definition: >-
    품질(정확도). 적합=명시된 벤치마크·모델에서 정확도 손실이 없거나 무시할 수준으로 보고됨. 조건부 적합=일부 모델·작업·설정에서 저하가 보고됨. 부적합=서비스 요구 품질을 충족하지 못한다는 사실 근거가 있음. 확인 불가=품질 근거가 없거나 요구 수준이 정의되지 않음. 데이터를 변경하지 않는 방식이라도 원문의 품질 보고 없이 적합으로 판정하지 않는다.
  judgments: [적합, 조건부 적합, 부적합, 확인 불가]
- id: operations
  definition: >-
    도입·운영 난이도. 적합=기존 서빙 프레임워크에서 설정 변경 수준으로 적용 가능하다는 근거(프레임워크 지원과 원 논문 구현의 동일성·버전 확인 포함). 조건부 적합=커스텀 구현, 별도 커널, 특정 하드웨어·드라이버·네트워크 구성이 필요함. 부적합=목표 환경과 명시적으로 양립할 수 없다는 사실 근거. 확인 불가=도입 조건 근거 없음. 신규 장비와 SW 스택 변경이 모두 필요하다는 사실만으로 부적합을 단정하지 않고 조건부 적합으로 두되, 통합 부담과 설계서 표 10과의 해석 차이를 limitations에 기록한다.
  judgments: [적합, 조건부 적합, 부적합, 확인 불가]
- id: scalability
  definition: >-
    확장성. 적합=동시 사용자·문맥 길이 증가에도 효과가 유지된다는 근거가 목표 규모 수준에서 확인됨. 조건부 적합=특정 규모(단일 GPU, 특정 배치·문맥·모델 크기·동시 요청 수)까지만 검증됨. 부적합=규모가 커질수록 효과가 감소한다는 사실 근거가 있음. 확인 불가=규모 관련 근거 없음. 논문 실험 규모(GPU 수·노드 수·동시 요청 수)와 실제 데이터센터 규모의 차이를 rationale에 반드시 기록한다.
  judgments: [적합, 조건부 적합, 부적합, 확인 불가]
source_policy: >-
  대상 기술의 target 논문 RAG와 데이터센터·클라우드 적용 사례 웹 자료를 사용한다. reference 논문은 새로 검색하지 않는다. 직접 근거는 technology가 해당 기술이고 scope=target인 자료뿐이며, 분야 배경(scope=context)이나 다른 기술의 결과는 판정의 직접 근거로 전용하지 않는다. 자사 논문·자사 발표는 first_party로 표시하고 독립 검증으로 취급하지 않는다.
