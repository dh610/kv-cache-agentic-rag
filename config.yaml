schema_version: 1
target_techs:
  sw: KIVI
  hw: ITME
domain: 데이터센터·클라우드 LLM 서빙
models:
  generator: gpt-4.1-mini
  judge: gpt-4.1-nano
  temperature: 0
  timeout_seconds: 60
  max_retries: 1
limits:  # 설계서 표 13 실행 한도
  search: 3  # 첫 검색 포함, 세부 질문마다 따로 적용
  questions: 6
  fix: 1  # 표현 오류 시 답변 수정 1회
  supplement: 1  # 종합 뒤 보완 재실행 1라운드 (main graph에서 사용)
retrieval:
  model: BAAI/bge-m3
  revision: main  # resolved model revision is recorded in index manifest
  chunk_size: 1200  # characters, matching the shared starter's baseline
  chunk_overlap: 200
  top_k: 5
  rerank: false  # opt-in, no unverified benchmark claim
  reranker: BAAI/bge-reranker-v2-m3
  candidates: 20
  index_dir: .cache/paper-index
