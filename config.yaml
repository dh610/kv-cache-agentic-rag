schema_version: 2
target_techs:
  sw: KIVI
  hw: ITME
domain: 데이터센터·클라우드 LLM 서빙
models:
  generator: gpt-4.1-mini
  judge: gpt-4.1-mini  # nano 는 claim 당 1개 check·근거 ID 규칙을 지키지 못했다
  temperature: 0
  timeout_seconds: 180  # 종합·보고서 생성이 60초를 넘겨 실패했다
  max_retries: 1
limits:
  search: 3  # includes initial attempt; per question
  questions: 10
  fix: 1
  supplement: 1  # 사용자 승인: 종합 뒤 보완 재실행 1라운드 (0이면 끔)
retrieval:
  model: BAAI/bge-m3
  revision: main  # resolved model revision is recorded in index manifest
  chunk_size: 1200  # characters, matching the shared starter's baseline
  chunk_overlap: 200
  top_k: 5
  rerank: false  # opt-in, no unverified benchmark claim
  reranker: BAAI/bge-reranker-v2-m3
  candidates: 20
  index_dir: .cache/paper-index
  web_excerpt_chars: 1200  # 질문 관련 문단만 남긴 웹 발췌 길이
  web_context_terms:  # 동명 이슈 방지: 하나도 없는 문서는 무관한 대상으로 본다
    - KV cache
    - KV 캐시
    - LLM
    - inference
    - quantization
    - 양자화
    - CXL
    - GPU 메모리

evaluation:
  samples: 30
  per_technology: 15
  language: ko
  acronym_numeric_fraction: 0.3333333333333333
  tie_mrr: 0.05
  min_hit5: 0.80
  min_mrr: 0.60
  candidates: [BAAI/bge-m3, intfloat/multilingual-e5-large, Alibaba-NLP/gte-multilingual-base]
  remediation: [chunking, bilingual, dense_sparse, rerank]
gap_policy:
  unknown_fraction: 0.5
  critical_criteria:
    market: [adoption]
    domain: [quality, cost]
    stakeholder: [competitors]
